        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; padding-top: 72px; }
        .text-brand-green { color: #10b981; }
        .bg-brand-navy  { background-color: #0f172a; }
        .bg-brand-green { background-color: #10b981; }

        /* ── HEADER ── */
        .sticky-header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: #0f172a; height: 72px; display: flex;
            align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .brand-logo { color: white; font-weight: 700; font-size: 1.5rem; text-decoration: none; }
        .back-btn {
            color: white; text-decoration: none; font-size: 0.85rem; font-weight: 500;
            padding: 8px 20px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px; transition: 0.3s;
        }
        .back-btn:hover { border-color: #10b981; background: rgba(16,185,129,0.1); }

        /* ── HERO ── */
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(16,185,129,0.12); color: #10b981;
            border: 1px solid rgba(16,185,129,0.3); border-radius: 50px;
            padding: 6px 16px; font-size: 0.75rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
        }

        /* ── BENEFIT CARDS ── */
        .benefit-card {
            background: white; border-radius: 16px; padding: 28px 24px;
            border: 1px solid #e2e8f0; transition: transform 0.3s, box-shadow 0.3s;
        }
        .benefit-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(15,23,42,0.1); }
        .benefit-icon {
            width: 52px; height: 52px; border-radius: 12px;
            background: rgba(16,185,129,0.1); display: flex; align-items: center;
            justify-content: center; margin-bottom: 16px;
        }

        /* ── WHAT IS TCO SECTION ── */
        .tco-pillar {
            background: white; border-radius: 16px; overflow: hidden;
            border: 1px solid #e2e8f0; text-align: center;
        }
        .tco-pillar-header { padding: 20px 24px 16px; }
        .tco-pillar-body { padding: 0 24px 24px; }
        .pillar-num {
            font-size: 3rem; font-weight: 800; line-height: 1;
            color: #10b981; opacity: 0.25;
        }

        /* ── PROCESS STEPS ── */
        .step-connector { width: 2px; height: 32px; background: #e2e8f0; margin: 0 auto; }

        /* ── SIMULATOR WRAPPER ── */
        .sim-outer {
            background: white; border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 40px rgba(15,23,42,0.08);
            overflow: hidden;
        }

        /* ── TCO SIMULATOR INTERNALS (preserved from TCO_simulator.html) ── */
        .fw-global-inputs {
            background: #f8fafc; padding: 16px 20px;
            border-bottom: 3px solid #0f172a;
            display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end;
        }
        .fw-g-field { flex: 1; min-width: 130px; }
        .fw-g-field label {
            display: block; font-weight: 700; margin-bottom: 4px;
            color: #0f172a; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .fw-g-field input {
            width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px;
            color: #0f172a; font-weight: 600; font-size: 13px; font-family: 'Poppins', sans-serif;
            background: white;
        }
        .fw-g-field input:focus { border-color: #10b981; outline: none; }
